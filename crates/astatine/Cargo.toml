clap = { version = "4.6.5", features = ["derive"] }
const_format = "0.2.37"
derive_more = { version = "2.1.1", features = ["full"] }
miette = { version = "7.6.0", features = ["fancy"] }
soft-canonicalize = "0.5.6"
